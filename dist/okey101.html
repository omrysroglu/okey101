<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Okey 101</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* ===== Okey 101 · Masa teması (prototip tasarımı) ===== */
  :root{
    --bg:#15181d; --bg-2:#0d0f12;
    --felt-1:#1E5246; --felt-2:#153C34; --felt-3:#0F2D27;
    --wood:#4A2F1C; --wood-hi:#6B4529; --wood-dark:#2E1C10;
    --ivory:#F4EDE1; --ivory-2:#EAE0CE; --ivory-edge:#C9B99C; --ink:#1C1A16;
    --red:#C2362B; --black:#1F1F1F; --blue:#1F64AD; --yellow:#A87300;
    --gold:#F5C451; --gold-ink:#1C1A16;
    --panel:#1c2026; --panel-2:#232830; --line:rgba(255,255,255,.12);
    --text:#EDE7DC; --muted:#B9B2A6; --good:#5FBF7A; --bad:#E0675A;
    --tfelt-1:#1E5246; --tfelt-2:#0F2D27; --tfelt-grid:rgba(255,255,255,.035);
    --rack-1:#6A4428; --rack-2:#5B3A22; --rack-dark:#3E2716;
    --font-ui:'Rubik',system-ui,'Segoe UI',sans-serif;
    --font-num:'Archivo Black','Arial Black','Segoe UI Black',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  html{background:var(--bg-2);}
  body{
    font-family:var(--font-ui);
    background:radial-gradient(1400px 800px at 50% -10%, #20252c 0%, var(--bg) 55%, var(--bg-2) 100%);
    color:var(--text);
    min-height:100vh; background-attachment:fixed;
  }
  #app{max-width:1180px;margin:0 auto;padding:18px 14px 60px;}
  h1,h2,h3{font-weight:700; margin:0 0 6px;}
  .brand{display:flex;align-items:baseline;gap:10px;margin-bottom:18px;}
  .brand .mark{font-family:var(--font-num); font-size:26px; letter-spacing:.5px; color:var(--gold);}
  .brand .sub{color:var(--muted); font-size:13px;}
  .card{
    background:linear-gradient(180deg,var(--panel-2),var(--panel));
    border:1px solid var(--line); border-radius:16px; padding:20px;
    box-shadow:0 12px 30px rgba(0,0,0,.45);
  }
  .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
  .col{display:flex; flex-direction:column; gap:6px;}
  label{font-size:12px; color:var(--muted); letter-spacing:.02em;}
  input[type=text], select{
    background:rgba(0,0,0,.35); border:1px solid var(--line); color:var(--text);
    padding:10px 12px; border-radius:10px; font-size:15px; font-family:inherit; outline:none;
  }
  select{font-size:14px;}
  input[type=text]:focus, select:focus{border-color:var(--gold);}
  button{
    font-family:inherit; font-size:14px; cursor:pointer; border:none; min-height:40px;
    padding:10px 16px; border-radius:10px; font-weight:700; letter-spacing:.01em;
    background:var(--gold); color:var(--gold-ink); transition:transform .08s ease, filter .12s ease;
  }
  button:hover{filter:brightness(1.07);}
  button:active{transform:translateY(1px);}
  button:focus-visible{outline:3px solid var(--gold); outline-offset:2px;}
  button.secondary{background:rgba(255,255,255,.08); color:var(--text); border:1px solid rgba(255,255,255,.18); font-weight:500;}
  button.danger{background:var(--bad); color:#2a0d09;}
  button:disabled{opacity:.4; cursor:not-allowed; filter:none;}
  .muted{color:var(--muted);}
  .small{font-size:12px;}
  .pill{
    display:inline-block; padding:5px 12px; border-radius:99px; font-size:12.5px;
    background:rgba(0,0,0,.4); border:1px solid var(--line); color:var(--text);
  }
  .divider{height:1px; background:var(--line); margin:16px 0;}
  .err{color:var(--bad); font-size:13px; margin-top:6px;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  @media (max-width:640px){ .grid2{grid-template-columns:1fr;} }

  /* Lobi koltukları */
  .seats{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin:14px 0;}
  .seat{
    background:rgba(0,0,0,.3); border:1px dashed var(--line); border-radius:12px; padding:12px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .seat.filled{border-style:solid; border-color:var(--gold);}
  .seat .name{font-weight:700;}
  .seat .tag{font-size:11px; color:var(--muted);}

  /* Masa: ahşap çerçeve + yeşil çuha */
  .board-top{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px;}
  .board{
    position:relative; border-radius:34px; padding:14px;
    background:linear-gradient(180deg,#563621,var(--wood));
    border:2px solid var(--wood-dark);
    box-shadow:0 18px 40px rgba(0,0,0,.6), inset 0 0 0 2px var(--wood-hi), inset 0 1px 0 rgba(255,255,255,.12);
  }
  .felt-table{
    border-radius:24px; padding:14px;
    background:radial-gradient(ellipse at center, var(--felt-1) 0%, var(--felt-2) 60%, var(--felt-3) 100%);
    box-shadow:inset 0 0 60px rgba(0,0,0,.55);
  }
  .table3{
    display:grid; grid-template-columns:78px minmax(0,1fr) 78px; grid-template-rows:auto minmax(400px,1fr) auto; gap:10px;
    grid-template-areas:". top ." "left mid right" "bottom bottom bottom";
  }
  .seat-top{grid-area:top; display:flex; flex-direction:column; align-items:center; gap:6px;}
  .seat-left{grid-area:left; display:flex; flex-direction:column; align-items:center; gap:8px;}
  .seat-right{grid-area:right; display:flex; flex-direction:column; align-items:center; gap:8px;}
  .seat-bottom{grid-area:bottom; display:flex; flex-direction:column; align-items:center; gap:8px;}

  /* İsim kartları */
  .nameplate{
    display:flex; align-items:center; gap:8px; max-width:100%;
    background:rgba(0,0,0,.45); border:1px solid rgba(255,255,255,.12); border-radius:99px;
    padding:4px 12px 4px 4px; box-shadow:0 4px 10px rgba(0,0,0,.35);
  }
  .nameplate.active{border-color:var(--gold); box-shadow:0 0 0 1px var(--gold) inset, 0 0 16px rgba(245,196,81,.45);}
  .nameplate.vertical{flex-direction:column; border-radius:16px; padding:8px 4px; gap:4px; text-align:center; width:100%;}
  .avatar{
    width:34px; height:34px; border-radius:50%; flex-shrink:0;
    background:#2D6CA8; border:2px solid var(--text);
    display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:700; color:#fff;
  }
  .nameplate.vertical .avatar{width:44px; height:44px; font-size:16px; background:#8E3B5E;}
  .seat-right .nameplate.vertical .avatar{background:#B4682A;}
  .seat-bottom .avatar{background:#2F6B3C;}
  .np-meta{display:flex; align-items:center; gap:8px; min-width:0;}
  .nameplate.vertical .np-meta{flex-direction:column; gap:3px;}
  .nameplate .nm{font-weight:500; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:130px;}
  .nameplate.vertical .nm{max-width:70px; font-size:11.5px;}
  .score-bubble{
    display:inline-flex; align-items:center; justify-content:center; min-width:34px; height:22px;
    background:rgba(0,0,0,.4); border:1px solid rgba(255,255,255,.18); border-radius:99px; font-size:12px;
    font-weight:700; color:var(--gold); padding:0 8px;
  }

  /* Istakalar */
  .rack{
    background:linear-gradient(180deg,var(--rack-1) 0%,var(--rack-2) 60%,var(--rack-dark) 100%);
    border:1px solid var(--wood-dark); border-radius:12px; padding:6px;
    box-shadow:inset 0 2px 0 rgba(255,255,255,.14), 0 10px 20px rgba(0,0,0,.55);
  }
  .rack-h{display:flex; gap:2px; justify-content:center; flex-wrap:nowrap; max-width:100%;}
  .rack-h .tback{flex:0 1 24px; min-width:6px;}
  .rack-v{display:flex; flex-direction:column; gap:2px; align-items:center;}
  .tback{
    width:24px; height:34px; border-radius:4px; flex-shrink:0;
    background:linear-gradient(160deg,var(--ivory),#E2D6C1);
    box-shadow:0 2px 0 #B8A88A, 0 3px 5px rgba(0,0,0,.3);
  }
  .rack-v .tback{width:34px; height:22px;}
  .rack-me{width:100%; max-width:940px; padding:4px 28px 0; border-radius:16px 16px 8px 8px;}
  .shelf{display:grid; gap:4px; padding:16px 4px 6px; border-bottom:6px solid var(--rack-dark); border-radius:0 0 3px 3px;}
  .shelf:last-child{padding-bottom:8px;}
  .slot{position:relative; aspect-ratio:56/74; border-radius:7px; background:transparent;}
  .slot.g::before{content:''; position:absolute; left:-2px; right:-2px; top:-6px; height:3px; background:var(--gold); pointer-events:none;}
  .slot.g.gs::before{left:0; border-radius:3px 0 0 3px;}
  .slot.g.ge::before{right:0; border-radius:0 3px 3px 0;}
  .slot.g.gs.ge::before{border-radius:3px;}
  .gsum{position:absolute; left:0; top:-19px; background:var(--gold); color:var(--gold-ink); font:700 11px/1 var(--font-ui); padding:2px 7px; border-radius:8px; pointer-events:none; z-index:2; white-space:nowrap;}
  .slot.over{background:rgba(245,196,81,.22); box-shadow:inset 0 0 0 2px var(--gold);}
  .slot .tile{position:absolute; inset:0; width:100%; height:100%; cursor:grab; touch-action:none; -webkit-user-select:none; user-select:none;}
  .tile.rk .num{font-size:clamp(15px,2.3vw,28px);}
  .tile.rk .dot{width:clamp(5px,.8vw,9px); height:clamp(5px,.8vw,9px);}
  .drag-ghost{
    position:fixed !important; z-index:200; pointer-events:none; margin:0; cursor:grabbing; opacity:.97;
    transform:scale(1.1) rotate(-3deg) !important; box-shadow:0 0 0 3px var(--gold), 0 18px 28px rgba(0,0,0,.55) !important;
  }
  .pile.drop{border:2px dashed var(--gold); background:rgba(245,196,81,.1); min-height:92px; justify-content:center;}
  .pile.drop .pl b{color:var(--gold);}
  .mid.over{outline:2px dashed var(--gold); outline-offset:-4px; background-color:rgba(245,196,81,.1);}

  /* Masanın ortası */
  .mid{
    grid-area:mid; border-radius:16px; padding:10px;
    background-color:rgba(0,0,0,.12);
    background-image:
      repeating-linear-gradient(0deg, var(--tfelt-grid) 0 1px, transparent 1px 26px),
      repeating-linear-gradient(90deg, var(--tfelt-grid) 0 1px, transparent 1px 26px);
    border:1px solid rgba(255,255,255,.06); box-shadow:inset 0 0 30px rgba(0,0,0,.3);
    display:grid; grid-template-columns:104px minmax(0,1fr) 104px; grid-template-rows:auto 1fr auto; gap:8px;
    grid-template-areas:"dtl deck dtr" "lanes lanes lanes" "dbl . dbr";
  }
  .pile-slot-tl{grid-area:dtl; justify-self:start;} .pile-slot-tr{grid-area:dtr; justify-self:end;}
  .pile-slot-bl{grid-area:dbl; justify-self:start; align-self:end;} .pile-slot-br{grid-area:dbr; justify-self:end; align-self:end;}
  .pile{display:flex; flex-direction:column; align-items:center; gap:4px; padding:6px; border-radius:10px; border:2px dashed rgba(255,255,255,.18); background:rgba(0,0,0,.2);}
  .pile .pl{font-size:10.5px; color:var(--muted); max-width:96px; text-align:center; line-height:1.25;}
  .pile.take{border:2px solid var(--gold); background:rgba(245,196,81,.14); cursor:pointer; box-shadow:0 0 16px rgba(245,196,81,.4);}
  .pile-empty{width:34px; height:48px; border-radius:5px; border:1px dashed rgba(255,255,255,.25);}

  .deckbox{grid-area:deck; display:flex; justify-content:center; align-items:flex-end; gap:26px;}
  .indicator-box{display:flex; flex-direction:column-reverse; align-items:center; gap:6px;}
  .indicator-box .lbl{font-size:12px; color:var(--muted);}
  .indicator-box .tile{width:52px; height:72px; box-shadow:0 0 0 3px var(--gold), 0 3px 0 var(--ivory-edge), 0 8px 14px rgba(0,0,0,.4);}
  .indicator-box:first-child .tile{transform:rotate(-6deg);}
  .indicator-box .tile .num{font-size:26px;}
  .indicator-box .tile .dot{width:9px; height:9px; margin-top:6px;}
  .deck-stack{
    width:52px; height:72px; border-radius:7px; position:relative;
    background:var(--ivory);
    box-shadow:3px -4px 0 #E9DECB, 6px -8px 0 #E2D6C1, 0 3px 0 var(--ivory-edge), 0 10px 16px rgba(0,0,0,.45);
    display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer;
    color:#5b4a2c; font-size:10.5px; font-weight:700; text-align:center; padding:4px; user-select:none; line-height:1.2;
  }
  .deck-stack .cnt{font-family:var(--font-num); font-size:17px; margin-top:3px; color:var(--ink);}
  .deck-stack:hover{filter:brightness(1.05);}
  .deck-stack.disabled{cursor:not-allowed; opacity:.6; filter:none;}
  .deck-stack:not(.disabled){outline:3px solid var(--gold); outline-offset:4px;}

  .lanes{grid-area:lanes; display:flex; flex-direction:column; gap:8px; justify-content:center;}
  .lane{
    display:flex; gap:10px; align-items:flex-start; padding:6px 10px; border-radius:12px; min-height:58px;
    background:rgba(0,0,0,.2); border:1px solid rgba(255,255,255,.06);
  }
  .lane.mine{border-color:rgba(245,196,81,.4);}
  .lane.active{box-shadow:0 0 0 1px rgba(245,196,81,.6) inset;}
  .lane-name{width:92px; flex-shrink:0; font-size:12.5px; font-weight:500; line-height:1.3; padding-top:2px;}
  .lane-name small{display:inline-block; margin-top:3px; font-weight:400; color:#fff; font-size:10.5px; background:#2F6B3C; padding:1px 7px; border-radius:99px;}
  .lane-name small:empty{display:none;}
  .lane-melds{display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; flex:1; min-height:44px;}
  .meld{display:flex; gap:2px; padding:2px; border-radius:6px;}
  .meld.workable{cursor:pointer; outline:1px dashed rgba(245,196,81,.75);}
  .meld.workable:hover{background:rgba(245,196,81,.2);}
  .notice{color:var(--gold); font-size:13px; font-weight:700;}
  .lane-empty{font-size:11.5px; color:var(--muted); font-style:italic;}

  /* Taşlar */
  .tile{
    width:46px; height:64px; border-radius:7px;
    background:linear-gradient(180deg,var(--ivory) 0%, var(--ivory-2) 100%);
    box-shadow:0 3px 0 var(--ivory-edge), 0 6px 10px rgba(0,0,0,.35);
    display:flex; flex-direction:column; align-items:center; justify-content:center; padding:0;
    position:relative; user-select:none; cursor:pointer; flex-shrink:0;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .tile.small{width:34px; height:48px;}
  .tile .num{font-family:var(--font-num); font-size:23px; font-weight:400; line-height:1;}
  .tile.small .num{font-size:16px;}
  .tile .dot{width:7px; height:7px; border-radius:50%; margin-top:5px;}
  .tile.selected{transform:translateY(-12px); box-shadow:0 0 0 3px var(--gold), 0 3px 0 var(--ivory-edge), 0 12px 18px rgba(0,0,0,.5);}
  .tile.fake .num{color:var(--ink) !important;}
  .tile .star{display:none;}
  .c-red{color:var(--red);} .c-black{color:var(--black);} .c-blue{color:var(--blue);} .c-yellow{color:var(--yellow);}
  .bg-red{background:var(--red);} .bg-black{background:var(--black);} .bg-blue{background:var(--blue);} .bg-yellow{background:var(--yellow);}

  .tile.mini{width:28px; height:38px; border-radius:4px; box-shadow:0 2px 0 var(--ivory-edge), 0 3px 6px rgba(0,0,0,.35);}
  .tile.mini .num{font-size:15px;}
  .tile.mini .dot{width:5px; height:5px; margin-top:2px;}
  .my-rack{display:flex; gap:5px; flex-wrap:wrap; min-height:70px;}
  .me-bar{display:flex; justify-content:space-between; align-items:center; width:100%; gap:10px; flex-wrap:wrap;}
  .rack-actions{display:flex; gap:8px; flex-wrap:wrap; align-items:center; justify-content:center;}
  .rack-actions .muted{color:#D2CBBF;}
  @media (max-width:760px){
    .table3{grid-template-columns:50px minmax(0,1fr) 50px; gap:6px; grid-template-areas:"top top top" "left mid right" "bottom bottom bottom";}
    .board{border-radius:22px; padding:8px;}
    .tback{width:18px; height:26px;}
    .rack-v .tback{width:26px; height:16px;}
    .rack{padding:4px;}
    .mid{
      grid-template-columns:72px minmax(0,1fr) 72px; padding:6px;
      grid-template-rows:auto auto 1fr auto;
      grid-template-areas:"deck deck deck" "dtl . dtr" "lanes lanes lanes" "dbl . dbr";
    }
    .rack-me{padding:4px 6px 0;}
    .shelf{gap:3px; padding:12px 2px 5px;}
    .lane{flex-direction:column; gap:4px;}
    .lane-name{width:auto;}
    .nameplate.vertical .nm{font-size:10px; max-width:44px;}
    .nameplate.vertical .avatar{width:28px; height:28px; font-size:12px;}
    .score-bubble{min-width:28px; font-size:11px;}
    .tile.mini{width:22px; height:32px;}
    .tile.mini .num{font-size:12px;}
    .pile .pl{max-width:66px;}
    .deckbox{gap:14px;}
    .felt-table{padding:8px; border-radius:16px;}
  }
  .timer-bar{height:8px; border-radius:4px; background:rgba(255,255,255,.12); overflow:hidden; width:160px;}
  .timer-fill{height:100%; background:var(--gold); transition:width 1s linear;}

  .log-panel{
    max-height:130px; overflow-y:auto; background:rgba(0,0,0,.3); border:1px solid var(--line);
    border-radius:12px; padding:8px 12px; font-size:12.5px; color:var(--muted); margin-top:12px;
  }
  .log-panel div{padding:2px 0;}

  /* Pencereler */
  .modal-backdrop{position:fixed; inset:0; background:rgba(0,0,0,.65); display:flex; align-items:center; justify-content:center; z-index:50; padding:14px;}
  .modal{
    background:linear-gradient(180deg,var(--panel-2),var(--panel)); border:1px solid var(--line); border-radius:16px; padding:20px;
    max-width:720px; width:100%; max-height:88vh; overflow-y:auto; box-shadow:0 20px 50px rgba(0,0,0,.6);
  }
  .group-box{
    border:1px solid var(--line); border-radius:10px; padding:8px; margin-bottom:8px;
    display:flex; gap:5px; align-items:center; flex-wrap:wrap; background:rgba(0,0,0,.25);
  }
  .group-box .glabel{font-size:11px; color:var(--muted); width:100%;}

  .scoreboard{width:100%; border-collapse:collapse; margin-top:10px;}
  .scoreboard th, .scoreboard td{padding:9px 10px; text-align:left; border-bottom:1px solid var(--line); font-size:13.5px;}
  .scoreboard th{color:var(--muted); font-weight:500; font-size:12px;}
  .delta-neg{color:var(--good); font-weight:700;}
  .delta-pos{color:var(--bad); font-weight:700;}

  .rules-accordion summary{cursor:pointer; color:var(--gold); font-size:13px; margin:10px 0 4px;}
  .rules-accordion .rule-list{font-size:12.5px; color:var(--muted); line-height:1.6;}
  .rules-accordion .rule-list b{color:var(--text);}

  .badge{display:inline-block; background:var(--gold); color:var(--gold-ink); font-size:10px; font-weight:700; padding:1px 6px; border-radius:99px; margin-left:6px;}
  footer.note{margin-top:26px; font-size:11.5px; color:var(--muted); line-height:1.6; border-top:1px solid var(--line); padding-top:12px;}

  /* ===== Ekrana sığdırma (masaüstü) ===== */
  .drag-ghost{padding:0 !important;}
  @media (min-width:761px){
    #app{max-width:1400px; padding:8px 14px 16px;}
    .brand{margin-bottom:8px;}
    .brand .mark{font-size:22px;}
    .board{padding:10px;}
    .board-top{margin-bottom:8px;}
    .felt-table{height:calc(100vh - 160px); min-height:480px; padding:10px;}
    .table3{height:100%; grid-template-rows:auto minmax(0,1fr) auto; gap:8px;}
    .seat-top{gap:4px;}
    .rack-h .tback{height:24px;}
    .seat-left,.seat-right{min-height:0; overflow:hidden; justify-content:flex-start;}
    .rack-v{gap:1px; flex:0 1 auto; min-height:0; max-height:100%; overflow:hidden; justify-content:flex-start;}
    .rack-v .tback{width:30px; height:auto; flex:1 1 22px; max-height:22px; min-height:3px;}
    .mid{min-height:0; overflow:hidden; grid-template-rows:auto minmax(0,1fr);
      grid-template-areas:"dtl deck dtr" "dbl lanes dbr";}
    .pile-slot-bl,.pile-slot-br{align-self:end;}
    .lanes{min-height:0; overflow-y:auto; justify-content:flex-start; gap:6px;}
    .lane{min-height:44px; padding:4px 10px;}
    .lane-melds{min-height:38px;}
    .seat-bottom{gap:6px;}
    .rack-me{max-width:min(940px, 88vh);}
    .shelf{padding:12px 4px 4px;}
    .log-panel{max-height:46px; margin-top:6px; padding:5px 12px;}
    .seat-bottom button{min-height:36px; padding:7px 14px;}
    .rack-actions{min-height:36px;}
  }
  @media (min-width:761px) and (max-height:820px){
    .brand{margin-bottom:4px;} .brand .mark{font-size:18px;} .brand button{min-height:32px; padding:5px 12px;}
    .board{padding:8px;} .board-top{margin-bottom:6px;} .board-top .pill{padding:3px 10px; font-size:12px;}

<body>
<div id="app"></div>

<script>
/* ============================== GAME LOGIC (pure) ============================== */
const COLORS = ['red','black','blue','yellow'];
const OPEN_MIN = 101;        // per/set ile açmak için gereken minimum toplam
const OPEN_MIN_PAIRS = 5;    // çift ile açmak için gereken minimum çift sayısı
const COLOR_HEX = {red:'#b5321f', black:'#1c1c1c', blue:'#1e5aa8', yellow:'#b8790f'};

function createDeck(){
  const tiles=[];
  for(const color of COLORS){
    for(let num=1; num<=13; num++){
      for(let copy=0; copy<2; copy++){
        tiles.push({id:`${color}-${num}-${copy}`, color, number:num, fake:false});
      }
    }
  }
  tiles.push({id:'fake-0', color:null, number:null, fake:true});
  tiles.push({id:'fake-1', color:null, number:null, fake:true});
  return tiles;
}
function shuffle(arr, rng){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor((rng?rng():Math.random())*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function dealRoundRaw(playerCount, dealerSeat){
  let deck = shuffle(createDeck());
  let indicator = deck.pop();
  // extremely rare: indicator is a fake joker -> put back, reshuffle remainder, redraw
  let guard=0;
  while(indicator.fake && guard<50){
    deck.push(indicator);
    deck = shuffle(deck);
    indicator = deck.pop();
    guard++;
  }
  const okeyColor = indicator.color;
  const okeyNumber = indicator.number===13 ? 1 : indicator.number+1;
  const hands={};
  for(let s=0;s<playerCount;s++) hands[s]=[];
  for(let s=0;s<playerCount;s++){
    const count = s===dealerSeat ? 22 : 21;   // 101: herkese 21, başlayana 22
    for(let i=0;i<count;i++) hands[s].push(deck.pop().id);
  }
  const allTilesById={};
  createDeck().forEach(t=>allTilesById[t.id]=t);
  return {hands, deck:deck.map(t=>t.id), indicatorTileId:indicator.id, okeyColor, okeyNumber, allTilesById};
}
// Sahte okey joker DEĞİLDİR: gerçek okeyin temsil ettiği taşın (renk+sayı) değerini taşıyan sıradan taştır.
function normTile(t, okeyColor, okeyNumber){
  return t.fake ? {id:t.id, color:okeyColor, number:okeyNumber, fake:false, _fk:true} : t;
}
function isOkey(tile, okeyColor, okeyNumber){
  if(tile.fake || tile._fk) return false;
  return tile.color===okeyColor && tile.number===okeyNumber;
}
function tileValue(tile, okeyColor, okeyNumber){
  if(tile.fake || tile._fk) return okeyNumber;
  if(isOkey(tile, okeyColor, okeyNumber)) return okeyNumber*2;
  return tile.number;
}
function validateGroup(tiles, okeyColor, okeyNumber){
  tiles = tiles.map(t=>normTile(t, okeyColor, okeyNumber));
  if(tiles.length<3) return {valid:false, reason:'min3'};
  const wilds = tiles.filter(t=>isOkey(t, okeyColor, okeyNumber));
  const real = tiles.filter(t=>!isOkey(t, okeyColor, okeyNumber));

  const setResult = (()=>{
    if(real.length===0){
      if(tiles.length>4) return null;
      return {type:'set', value: tiles.reduce((s,t)=>s+tileValue(t,okeyColor,okeyNumber),0)};
    }
    const num = real[0].number;
    if(!real.every(t=>t.number===num)) return null;
    const colorsUsed = new Set(real.map(t=>t.color));
    if(colorsUsed.size !== real.length) return null;
    if(tiles.length>4) return null;
    const value = real.reduce((s,t)=>s+t.number,0) + wilds.reduce((s)=>s+num,0);
    return {type:'set', value};
  })();
  if(setResult) return {valid:true, ...setResult};

  const runPre = (()=>{
    if(real.length===0) return {allWild:true};
    const color = real[0].color;
    if(!real.every(t=>t.color===color)) return null;
    const nums = real.map(t=>t.number).sort((a,b)=>a-b);
    for(let i=1;i<nums.length;i++) if(nums[i]===nums[i-1]) return null;
    const minNum=nums[0], maxNum=nums[nums.length-1];
    const span = maxNum-minNum+1;
    if(span>tiles.length) return null;
    const gapsToFill = span-real.length;
    if(gapsToFill>wilds.length) return null;
    const extraWilds = wilds.length-gapsToFill;
    const totalLen = span+extraWilds;
    if(totalLen>13) return null;
    return {minNum, maxNum, extraWilds};
  })();
  if(runPre && !runPre.allWild){
    let {minNum, maxNum, extraWilds} = runPre;
    let lo=minNum, hi=maxNum, left=extraWilds;
    while(left>0 && lo>1){lo--; left--;}
    while(left>0 && hi<13){hi++; left--;}
    let value=0;
    for(let k=lo;k<=hi;k++) value+=k;
    return {valid:true, type:'run', value};
  }
  if(runPre && runPre.allWild){
    if(tiles.length>13) return {valid:false, reason:'no_match'};
    return {valid:true, type:'run', value:tiles.length};
  }
  return {valid:false, reason:'no_match'};
}
function validateClose(groupsOfTileObjs, okeyColor, okeyNumber){
  let total=0, tileCount=0, containsOkey=false;
  for(const g of groupsOfTileObjs){
    const res = validateGroup(g, okeyColor, okeyNumber);
    if(!res.valid) return {valid:false, reason:res.reason, badGroup:g};
    total+=res.value; tileCount+=g.length;
    if(g.some(t=>isOkey(t,okeyColor,okeyNumber))) containsOkey=true;
  }
  return {valid:true, meldValue:total, tileCount, containsOkey};
}
function validatePairs(tiles, okeyColor, okeyNumber){
  tiles = tiles.map(t=>normTile(t, okeyColor, okeyNumber));
  if(tiles.length%2!==0) return {valid:false};
  const wilds = tiles.filter(t=>isOkey(t,okeyColor,okeyNumber));
  const real = tiles.filter(t=>!isOkey(t,okeyColor,okeyNumber));
  const counts={};
  for(const t of real){ const k=t.color+'-'+t.number; counts[k]=(counts[k]||0)+1; }
  let neededWilds=0;
  for(const k of Object.keys(counts)){
    const c=counts[k];
    if(c%2===1) neededWilds+=1;
    if(c>2) return {valid:false};
  }
  if(neededWilds>wilds.length) return {valid:false};
  const leftover = wilds.length-neededWilds;
  if(leftover%2!==0) return {valid:false};
  return {valid:true, pairCount:tiles.length/2, containsOkey:wilds.length>0};
}

/* ---- per düzenleme, işleme, açabilme hesabı ---- */
// Geçerli bir perin taşlarını sıralar (seri: sayıya göre; okey boşluğa/uca yerleşir). reps: her konumun temsil ettiği sayı.
function arrangeMeld(ids, room){
  const oc=room.okeyColor, on=room.okeyNumber;
  const T=ids.map(id=>({id, t:normTile(room.allTilesById[id],oc,on)}));
  const res=validateGroup(T.map(x=>x.t),oc,on);
  if(!res.valid) return null;
  const wild=T.filter(x=>isOkey(x.t,oc,on)), real=T.filter(x=>!isOkey(x.t,oc,on));
  if(res.type==='set'){
    return {type:'set', ids:real.map(x=>x.id).concat(wild.map(x=>x.id)), num: real.length?real[0].t.number:null, colors:real.map(x=>x.t.color), wildIdx:wild.map((_,i)=>real.length+i)};
  }
  if(!real.length) return {type:'run', ids:ids.slice(), color:null, nums:[], wildIdx:[]};
  const color=real[0].t.color;
  real.sort((a,b)=>a.t.number-b.t.number);
  const lo0=real[0].t.number, hi0=real[real.length-1].t.number;
  const seq=[]; const pool=wild.slice(); let ri=0;
  for(let k=lo0;k<=hi0;k++){
    if(ri<real.length && real[ri].t.number===k){ seq.push({num:k,id:real[ri].id,wild:false}); ri++; }
    else seq.push({num:k,id:pool.pop().id,wild:true});
  }
  let hi=hi0, lo=lo0;
  while(pool.length && hi<13){ hi++; seq.push({num:hi,id:pool.pop().id,wild:true}); }
  while(pool.length && lo>1){ lo--; seq.unshift({num:lo,id:pool.pop().id,wild:true}); }
  return {type:'run', ids:seq.map(x=>x.id), color, nums:seq.map(x=>x.num), wildIdx:seq.map((x,i)=>x.wild?i:-1).filter(i=>i>=0)};
}
// bir taş verilen pere eklenebilir mi?
function canExtendMeld(tileId, meldIds, room){
  const tiles=meldIds.concat([tileId]).map(id=>room.allTilesById[id]);
  return validateGroup(tiles, room.okeyColor, room.okeyNumber).valid;
}
// masadaki herhangi bir (seri/set ile açılmış) pere işlenebilir mi?
function canExtendAnywhere(tileId, room){
  for(const seat of Object.keys(room.table||{})){
    const info=room.opened && room.opened[seat];
    if(!info || info.mode!=='groups') continue;
    for(const g of room.table[seat]) if(canExtendMeld(tileId,g,room)) return true;
  }
  return false;
}
// perdeki okeyin temsil ettiği gerçek taş elde varsa: okeyin id'sini döndür
function findSwapOkey(tileId, meldIds, room){
  const oc=room.okeyColor, on=room.okeyNumber;
  const a=arrangeMeld(meldIds, room); if(!a || !a.wildIdx.length) return null;
  const t=normTile(room.allTilesById[tileId],oc,on);
  if(isOkey(t,oc,on)) return null;
  if(a.type==='run'){
    for(const i of a.wildIdx){ if(t.color===a.color && t.number===a.nums[i]) return a.ids[i]; }
    return null;
  }
  if(a.num!==null && t.number===a.num && !a.colors.includes(t.color)) return a.ids[a.wildIdx[0]];
  return null;
}
// eldeki taşlarla (çekilen taş dahil) hemen açılabilir mi? 101 per toplamı ya da çift; en az 1 taş elde kalmalı.
const _openCache = new Map();
function canOpenWith(ids, room){
  const key=ids.slice().sort().join(',')+'|'+room.okeyColor+room.okeyNumber;
  if(_openCache.has(key)) return _openCache.get(key);
  const r=_canOpenWith(ids, room);
  if(_openCache.size>200) _openCache.clear();
  _openCache.set(key,r); return r;
}
function _canOpenWith(ids, room){
  const oc=room.okeyColor, on=room.okeyNumber;
  const tiles=ids.map(id=>normTile(room.allTilesById[id],oc,on));
  let wilds=0; const cnt=Array(52).fill(0);
  for(const t of tiles){ if(isOkey(t,oc,on)) wilds++; else cnt[COLORS.indexOf(t.color)*13+t.number-1]++; }
  let P=0, singles=0;
  for(const c of cnt){ P+=Math.floor(c/2); if(c%2) singles++; }
  const pairsMax = P + Math.min(wilds,singles) + Math.floor(Math.max(0,wilds-singles)/2);
  if(pairsMax>=OPEN_MIN_PAIRS && tiles.length>2*OPEN_MIN_PAIRS) return true;
  const memo=new Map();
  function rec(w, flag){
    let i=0; while(i<52 && cnt[i]===0) i++;
    if(i===52) return (flag||w>0)?0:-1e9;
    const key=cnt.join('')+'|'+w+'|'+flag;
    if(memo.has(key)) return memo.get(key);
    const c=Math.floor(i/13), n=i%13+1;
    let best=-1e9;
    cnt[i]--; best=Math.max(best, rec(w,1)); cnt[i]++;
    for(let s0=Math.max(1,n-2); s0<=n; s0++){
      for(let L=3; s0+L-1<=13; L++){
        const e=s0+L-1; if(e<n) continue;
        let need=0; const used=[];
        for(let k=s0;k<=e;k++){
          const idx=c*13+k-1;
          if(k===n || (k>n && cnt[idx]>0)) used.push(idx); else need++;
        }
        if(need>w) continue;
        let v=0; for(let k=s0;k<=e;k++) v+=k;
        used.forEach(x=>cnt[x]--);
        best=Math.max(best, v+rec(w-need,flag));
        used.forEach(x=>cnt[x]++);
      }
    }
    const avail=[]; for(let cc=c+1;cc<4;cc++) if(cnt[cc*13+n-1]>0) avail.push(cc*13+n-1);
    for(let mask=0; mask<(1<<avail.length); mask++){
      const sel=avail.filter((_,b)=>mask&(1<<b));
      const base=1+sel.length;
      for(let j=0;j<=w && base+j<=4;j++){
        if(base+j<3) continue;
        sel.forEach(x=>cnt[x]--); cnt[i]--;
        best=Math.max(best, n*(base+j)+rec(w-j,flag));
        cnt[i]++; sel.forEach(x=>cnt[x]++);
      }
    }
    memo.set(key,best); return best;
  }
  return rec(wilds,0)>=OPEN_MIN;
}


// ---- Eli en yüksek puanlı perlere ayırma (Seri Diz) ----
// Dönen: {groups:[[id..]..], leftover:[id..], value}. Per toplamını en büyükleyen kombinasyon.
function bestMeldPlan(ids, room){
  const oc=room.okeyColor, on=room.okeyNumber;
  const pools=Array.from({length:52},()=>[]), wildIds=[];
  for(const id of ids){
    const t=normTile(room.allTilesById[id],oc,on);
    if(isOkey(t,oc,on)) wildIds.push(id); else pools[COLORS.indexOf(t.color)*13+t.number-1].push(id);
  }
  const cnt=pools.map(p=>p.length);
  const memo=new Map();
  function rec(w){
    let i=0; while(i<52 && cnt[i]===0) i++;
    if(i===52) return {v:0, ch:null};
    const key=cnt.join('')+'|'+w;
    if(memo.has(key)) return memo.get(key);
    const c=Math.floor(i/13), n=i%13+1;
    cnt[i]--; let best={v:rec(w).v, ch:{t:'skip', i}}; cnt[i]++;
    for(let s0=Math.max(1,n-2); s0<=n; s0++){
      for(let L=3; s0+L-1<=13; L++){
        const e=s0+L-1; if(e<n) continue;
        let need=0; const used=[];
        for(let k=s0;k<=e;k++){ const idx=c*13+k-1; if(k===n || (k>n && cnt[idx]>0)) used.push(idx); else need++; }
        if(need>w) continue;
        let v=0; for(let k=s0;k<=e;k++) v+=k;
        used.forEach(x=>cnt[x]--);
        const r=v+rec(w-need).v;
        used.forEach(x=>cnt[x]++);
        if(r>best.v) best={v:r, ch:{t:'run', c, s0, e, used:used.slice(), need}};
      }
    }
    const avail=[]; for(let cc=c+1;cc<4;cc++) if(cnt[cc*13+n-1]>0) avail.push(cc*13+n-1);
    for(let mask=0; mask<(1<<avail.length); mask++){
      const sel=avail.filter((_,b)=>mask&(1<<b)), base=1+sel.length;
      for(let j=0;j<=w && base+j<=4;j++){
        if(base+j<3) continue;
        sel.forEach(x=>cnt[x]--); cnt[i]--;
        const r=n*(base+j)+rec(w-j).v;
        cnt[i]++; sel.forEach(x=>cnt[x]++);
        if(r>best.v) best={v:r, ch:{t:'set', idxs:[i].concat(sel), j}};
      }
    }
    memo.set(key,best); return best;
  }
  const total=rec(wildIds.length).v;
  const groups=[], leftover=[];
  let guard=0;
  while(guard++<200){
    const b=rec(wildIds.length); if(!b.ch) break;
    const ch=b.ch;
    if(ch.t==='skip'){ cnt[ch.i]--; leftover.push(pools[ch.i].pop()); }
    else if(ch.t==='run'){
      const g=[];
      for(let k=ch.s0;k<=ch.e;k++){ const idx=ch.c*13+k-1; if(ch.used.includes(idx)){ cnt[idx]--; g.push(pools[idx].pop()); } else g.push(wildIds.pop()); }
      groups.push(g);
    } else {
      const g=ch.idxs.map(idx=>{ cnt[idx]--; return pools[idx].pop(); });
      for(let k=0;k<ch.j;k++) g.push(wildIds.pop());
      groups.push(g);
    }
  }
  return {groups, leftover:leftover.concat(wildIds), value:total};
}
// ---- Eli çiftlere ayırma (Çift Diz) ----
function bestPairPlan(ids, room){
  const oc=room.okeyColor, on=room.okeyNumber, T=id=>normTile(room.allTilesById[id],oc,on);
  const pools={}, wilds=[];
  for(const id of ids){ const t=T(id); if(isOkey(t,oc,on)) wilds.push(id); else (pools[t.color+'-'+t.number]=pools[t.color+'-'+t.number]||[]).push(id); }
  const pairs=[]; let singles=[];
  Object.keys(pools).forEach(k=>{ const p=pools[k]; while(p.length>=2) pairs.push([p.pop(),p.pop()]); if(p.length) singles.push(p.pop()); });
  singles.sort((a,b)=>T(b).number-T(a).number);            // okeyler en yüksek teklerle eşlenir
  while(wilds.length && singles.length) pairs.push([singles.shift(), wilds.pop()]);
  while(wilds.length>=2) pairs.push([wilds.pop(), wilds.pop()]);
  const sk=id=>{ const t=T(id); return isOkey(t,oc,on)?999:COLORS.indexOf(t.color)*13+t.number; };
  pairs.sort((a,b)=>sk(a[0])-sk(b[0]));
  return {pairs, leftover:singles.concat(wilds)};
}
/* ============================== STORAGE HELPERS ============================== */
function roomKey(code){ return 'room-'+code; }
// Claude'da yayınlanınca window.storage, başka yerde (Vercel) /api/room kullanılır.
function useClaudeStorage(){ return !!(window.storage && typeof window.storage.get==='function'); }
async function loadRoom(code){
  try{
    if(useClaudeStorage()){
      const res = await window.storage.get(roomKey(code), true);
      return res ? JSON.parse(res.value) : null;
    }
    const r = await fetch('/api/room?code='+encodeURIComponent(code), {cache:'no-store'});
    if(r.status===404) return null;
    if(!r.ok) throw new Error('HTTP '+r.status);
    return await r.json();
  }catch(e){ console.error('load failed', e); return null; }
}
async function saveRoom(code, obj){
  try{
    if(useClaudeStorage()){
      await window.storage.set(roomKey(code), JSON.stringify(obj), true);
      return true;
    }
    const r = await fetch('/api/room?code='+encodeURIComponent(code), {
      method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(obj),
    });
    if(!r.ok) throw new Error('HTTP '+r.status);
    return true;
  }catch(e){ console.error('save failed', e); return false; }
}
function genCode(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s='';
  for(let i=0;i<5;i++) s+=chars[Math.floor(Math.random()*chars.length)];
  return s;
}
// In solo-test mode (S.code is null) there's no room to sync — just update local state.
async function persist(room){
  if(S.code){ await saveRoom(S.code, room); }
  S.room = room;
  render();
}
function myId(){
  let id = sessionStorage.getItem('okey101_myid');
  if(!id){ id = 'p'+Math.random().toString(36).slice(2,10); sessionStorage.setItem('okey101_myid', id); }
  return id;
}

let pollHandle=null;
let botHandle=null;

function tileById(tid){
  return S.room && S.room.allTilesById ? S.room.allTilesById[tid] : null;
}
function seatOffset(seat){
  // 0=bottom(me),1=right,2=top,3=left
  const n = S.room.players.length;
  return ((seat - S.mySeat) % n + n) % n;
}
function nextSeat(seat){ return (seat+1) % S.room.players.length; }
function prevSeat(seat){ const n=S.room.players.length; return (seat-1+n)%n; }

/* ============================== SOLO TEST MODE (no friends needed) ============================== */
function clearBotLoop(){ if(botHandle){ clearInterval(botHandle); botHandle=null; } }

function startSoloTest(){
  clearBotLoop();
  if(pollHandle){ clearInterval(pollHandle); pollHandle=null; }
  const name = (S.nameInput||'').trim() || 'Sen';
  const turnSeconds = S.turnSecondsChoice==='none' ? null : parseInt(S.turnSecondsChoice,10);
  const dealt = dealRoundRaw(4, 0);
  const room = {
    code:'TEST', createdAt:Date.now(), turnSeconds, status:'playing', maxPlayers:4,
    players:[
      {seat:0, name, uid:myId()},
      {seat:1, name:'Bot Ayşe', uid:'bot1'},
      {seat:2, name:'Bot Mehmet', uid:'bot2'},
      {seat:3, name:'Bot Deniz', uid:'bot3'},
    ],
    dealerSeat:0, round:1,
    scores:{0:0,1:0,2:0,3:0},
    hands:dealt.hands, deck:dealt.deck, indicatorTileId:dealt.indicatorTileId,
    okeyColor:dealt.okeyColor, okeyNumber:dealt.okeyNumber, allTilesById:dealt.allTilesById,
    discards:{0:[],1:[],2:[],3:[]},
    turnSeat:0, turnPhase:'discard',
    turnDeadline: turnSeconds ? Date.now()+turnSeconds*1000 : null,
    takeEvents:[], roundResult:null,
    table:{0:[],1:[],2:[],3:[]}, opened:{0:null,1:null,2:null,3:null},
    log:['Test masası kuruldu — botlara karşı masayı inceleyebilirsin.'],
  };
  S.code=null; S.mySeat=0; S.name=name; S.room=room; S.screen='game'; S.error='';
  render();
  botHandle = setInterval(botTick, 1400);
}

function leaveSoloTest(){
  clearBotLoop();
  S.code=null; S.room=null; S.screen='landing'; S.error='';
  render();
}

function botTick(){
  if(!S.room || S.code!==null || S.screen!=='game') return; // safety: only runs in solo mode
  if(S.room.status!=='playing') return;
  const seat = S.room.turnSeat;
  if(seat===S.mySeat) return; // wait for the human
  const room = deepClone(S.room);
  if(room.turnPhase==='draw'){
    if(room.deck.length===0){
      scoreRound(room, null, null);
      S.room = room; render(); return;
    } else {
      const fromDiscardSeat = prevSeat(seat);
      const canTakeDiscard = false; // botlar açamadığı için atıktan taş alamaz (kural)
      let tid;
      if(canTakeDiscard){
        tid = room.discards[fromDiscardSeat].pop();
        room.takeEvents = room.takeEvents||[];
        room.takeEvents.push({takerSeat:seat, fromSeat:fromDiscardSeat, tileId:tid, atTurn:seat});
      } else {
        tid = room.deck.pop();
      }
      room.hands[seat].push(tid);
      room.turnPhase='discard';
    }
  } else {
    const hand = room.hands[seat];
    const idx = Math.floor(Math.random()*hand.length);
    const tid = hand.splice(idx,1)[0];
    room.discards[seat].push(tid);
    room.turnSeat = nextSeat(seat);
    room.turnPhase='draw';
    if(room.deck.length===0){ scoreRound(room, null, null); S.room = room; render(); return; }
  }
  room.turnDeadline = room.turnSeconds ? Date.now()+room.turnSeconds*1000 : null;
  S.room = room; render();
}

/* ============================== ROOM ACTIONS ============================== */
async function createRoom(){
  clearBotLoop();
  const name = S.nameInput.trim();
  if(!name){ S.error='İsim gir.'; render(); return; }
  S.busy=true; render();
  const code = genCode();
  const room = {
    code, createdAt:Date.now(), turnSeconds: S.turnSecondsChoice==='none'? null: parseInt(S.turnSecondsChoice,10),
    status:'lobby', maxPlayers:4,
    players:[{seat:0, name, uid:myId()}],
    dealerSeat:0, round:0,
    scores:{0:0,1:0,2:0,3:0},
    log:[],
  };
  const ok = await saveRoom(code, room);
  S.busy=false;
  if(!ok){ S.error='Oda oluşturulamadı, tekrar dene.'; render(); return; }
  S.code=code; S.name=name; S.mySeat=0; S.room=room; S.screen='lobby'; S.error='';
  startPolling();
  render();
}

async function joinRoom(){
  clearBotLoop();
  const code = S.joinCodeInput.trim().toUpperCase();
  const name = S.nameInput.trim();
  if(!code || !name){ S.error='Oda kodu ve isim gir.'; render(); return; }
  S.busy=true; render();
  const room = await loadRoom(code);
  if(!room){ S.busy=false; S.error='Oda bulunamadı.'; render(); return; }
  // already joined this uid before? reattach to same seat
  const existing = room.players.find(p=>p.uid===myId());
  if(existing){
    S.busy=false; S.code=code; S.name=existing.name; S.mySeat=existing.seat; S.room=room;
    S.screen = room.status==='lobby' ? 'lobby' : 'game';
    startPolling(); render(); return;
  }
  if(room.players.length>=room.maxPlayers){ S.busy=false; S.error='Oda dolu.'; render(); return; }
  if(room.status!=='lobby'){ S.busy=false; S.error='Bu oyun zaten başlamış.'; render(); return; }
  const takenSeats = new Set(room.players.map(p=>p.seat));
  let seat=0; while(takenSeats.has(seat)) seat++;
  room.players.push({seat, name, uid:myId()});
  room.players.sort((a,b)=>a.seat-b.seat);
  const ok = await saveRoom(code, room);
  S.busy=false;
  if(!ok){ S.error='Katılınamadı, tekrar dene.'; render(); return; }
  S.code=code; S.name=name; S.mySeat=seat; S.room=room; S.screen='lobby'; S.error='';
  startPolling(); render();
}

async function startGame(){
  if(S.room.players.length < S.room.maxPlayers){ return; }
  const dealt = dealRoundRaw(S.room.players.length, 0);
  const room = {...S.room};
  room.status='playing';
  room.round=1;
  room.dealerSeat=0;
  room.hands=dealt.hands;
  room.deck=dealt.deck;
  room.indicatorTileId=dealt.indicatorTileId;
  room.okeyColor=dealt.okeyColor;
  room.okeyNumber=dealt.okeyNumber;
  room.allTilesById=dealt.allTilesById;
  room.discards={0:[],1:[],2:[],3:[]};
  room.turnSeat=0;
  room.turnPhase='discard';   // başlayan 22 taşla başlar, önce taş atar
  room.turnDeadline = room.turnSeconds ? Date.now()+room.turnSeconds*1000 : null;
  room.takeEvents=[]; room.table={0:[],1:[],2:[],3:[]}; room.opened={0:null,1:null,2:null,3:null};
  room.log=[`El ${room.round} başladı. Gösterge: ${describeTile(tileByIdRaw(room, room.indicatorTileId))}`];
  room.roundResult=null;
  await saveRoom(S.code, room);
  S.room=room; S.screen='game'; render();
}

function tileByIdRaw(room, tid){ return room.allTilesById[tid]; }
function describeTile(t){
  if(!t) return '?';
  if(t.fake) return 'Sahte Okey';
  const trColor={red:'Kırmızı', black:'Siyah', blue:'Mavi', yellow:'Sarı'}[t.color];
  return `${trColor} ${t.number}`;
}

async function refreshRoom(){
  if(!S.code) return;
  const fresh = await loadRoom(S.code);
  if(!fresh) return;
  S.room = fresh;
  // handle auto turn timeout (only the current-turn player's own client drives it, to avoid double actions)
  if(fresh.status==='playing' && fresh.turnDeadline && Date.now()>fresh.turnDeadline && fresh.turnSeat===S.mySeat){
    await handleMyTimeout();
    return;
  }
  if(S.screen==='lobby' && fresh.status==='playing'){ S.screen='game'; }
  render();
}
function startPolling(){
  if(pollHandle) clearInterval(pollHandle);
  pollHandle = setInterval(refreshRoom, 1500);
}

/* ============================== GAMEPLAY ACTIONS ============================== */
async function drawFromDeck(){
  if(!isMyTurn() || S.room.turnPhase!=='draw') return;
  const room = deepClone(S.room);
  if(room.deck.length===0){ scoreRound(room, null, null); await persist(room); return; }
  const tid = room.deck.pop();
  room.hands[S.mySeat].push(tid);
  room.turnPhase='discard';
  room.turnDeadline = room.turnSeconds ? Date.now()+room.turnSeconds*1000 : null;
  pushLog(room, `${myName()} yerden taş çekti.`);
  await persist(room);
}

function canDrawFromDiscard(){
  return isMyTurn() && S.room.turnPhase==='draw' && discardSourceSeat()!==null && S.room.noRetakeSeat!==S.mySeat;
}
function discardSourceSeat(){
  const src = prevSeat(S.room.turnSeat);
  if(S.room.discards[src] && S.room.discards[src].length>0) return src;
  return null;
}
async function drawFromDiscard(){
  const src = discardSourceSeat();
  if(!canDrawFromDiscard()) return;
  const iOpened = !!(S.room.opened && S.room.opened[S.mySeat]);
  if(!iOpened){
    const top = S.room.discards[src][S.room.discards[src].length-1];
    if(!canOpenWith(S.room.hands[S.mySeat].concat([top]), S.room)){
      notify('Bu taşla elini hemen açamıyorsun; yalnızca açabiliyorsan atıktan taş alabilirsin. Yerden çek.');
      return;
    }
  }
  const room = deepClone(S.room);
  const tid = room.discards[src].pop();
  if(!iOpened) room.mustOpenSeat = S.mySeat;
  room.hands[S.mySeat].push(tid);
  room.turnPhase='discard';
  room.turnDeadline = room.turnSeconds ? Date.now()+room.turnSeconds*1000 : null;
  room.takeEvents = room.takeEvents || [];
  room.takeEvents.push({takerSeat:S.mySeat, fromSeat:src, tileId:tid, atTurn:room.turnSeat});
  const t = room.allTilesById[tid];
  pushLog(room, `${myName()}, ${seatName(room, src)} oyuncusunun attığı ${describeTile(t)} taşını aldı.`);
  if(!iOpened) pushAlert('Atıktan taş aldın: elini aç ya da açamıyorsan "Taşı Geri Bırak" ile geri koy.', 'warn');
  await persist(room);
}

async function discardTile(tid){
  if(!isMyTurn() || S.room.turnPhase!=='discard') return;
  if(mustReturnNow()){ notify('Atıktan aldığın taşla elini açmalısın ya da "Taşı Geri Bırak" ile geri koymalısın.'); render(); return; }
  const room = deepClone(S.room);
  room.noRetakeSeat=null;
  const hand = room.hands[S.mySeat];
  const idx = hand.indexOf(tid);
  if(idx===-1) return;
  hand.splice(idx,1);
  room.discards[S.mySeat].push(tid);
  const t = room.allTilesById[tid];
  pushLog(room, `${myName()}, ${describeTile(t)} taşını attı.`);
  if(hand.length===0 && room.opened && room.opened[S.mySeat]){
    const info = room.opened[S.mySeat];
    S.room = room; S.selectedIdx=null;
    await finalizeClose({mode:info.mode, meldValue:info.meldValue||0, pairCount:info.pairCount||null, lastOkey:isOkey(t, room.okeyColor, room.okeyNumber)});
    return;
  }
  // +101 ceza durumları
  const msgs=[];
  if(isOkey(t, room.okeyColor, room.okeyNumber)){ addPenalty(room,S.mySeat,101,'Okeyi yere attı'); msgs.push('Okeyi yere attın: +101 ceza.'); }
  if(canExtendAnywhere(tid, room)){ addPenalty(room,S.mySeat,101,'İşlenebilir taş attı'); msgs.push('Masadaki bir pere işlenebilecek taşı attın: +101 ceza.'); }
  if(room.mustOpenSeat===S.mySeat){
    if(!(room.opened && room.opened[S.mySeat])){ addPenalty(room,S.mySeat,101,'Atıktan aldığı taşla elini açmadı'); msgs.push('Atıktan aldığın taşla elini açmadın: +101 ceza.'); }
    room.mustOpenSeat=null;
  }
  msgs.forEach(m=>pushLog(room, `${myName()}: ${m}`));
  if(room.deck.length===0){
    S.selectedIdx=null;
    scoreRound(room, null, null);
    await persist(room);
    return;
  }
  room.turnSeat = nextSeat(S.mySeat);
  room.turnPhase='draw';
  room.turnDeadline = room.turnSeconds ? Date.now()+room.turnSeconds*1000 : null;
  S.selectedIdx=null;
  await persist(room);
}

async function autoDrawOnTimeout(){
  // draw from deck automatically then immediately discard the same tile drawn (simplest safe auto-move) and pass turn
  const room = deepClone(S.room);
  if(room.turnPhase!=='draw' || room.turnSeat!==S.mySeat) return;
  if(room.deck.length===0){ render(); return; }
  const tid = room.deck.pop();
  pushLog(room, `${myName()} süresi doldu, otomatik taş çekildi ve atıldı.`);
  room.discards[S.mySeat].push(tid);
  room.turnSeat = nextSeat(S.mySeat);
  room.turnPhase='draw';
  room.turnDeadline = room.turnSeconds ? Date.now()+room.turnSeconds*1000 : null;
  if(room.deck.length===0) scoreRound(room, null, null);
  await persist(room);
}

// Ceza uyarıları: masadaki herhangi bir oyuncuya yeni ceza yazıldığında herkese anında gösterilir
function pushAlert(msg, kind){
  S.alerts = (S.alerts||[]).filter(a=>a.until>Date.now());
  S.alerts.push({msg, kind:kind||'pen', until:Date.now()+7000});
  if(S.alerts.length>3) S.alerts=S.alerts.slice(-3);
}
function checkPenaltyAlerts(){
  const r=S.room; if(!r) return;
  const key=(r.code||'solo')+'|'+(r.round||1);
  const pens=r.penalties||[];
  if(S.penKey!==key){ S.penSeen = S.penKey===null ? pens.length : 0; S.penKey=key; }   // ilk açılışta eski cezaları gösterme
  if(pens.length<S.penSeen) S.penSeen=pens.length;
  for(let i=S.penSeen;i<pens.length;i++){
    const p=pens[i];
    const who = p.seat===S.mySeat ? 'Sen' : seatName(r,p.seat);
    pushAlert(`${who}: ${p.label} · +${p.amount} ceza`, p.seat===S.mySeat ? 'pen-me' : 'pen');
  }
  S.penSeen=pens.length;
}
function alertsHTML(){
  const now=Date.now();
  S.alerts=(S.alerts||[]).filter(a=>a.until>now);
  if(!S.alerts.length) return '';
  return `<div class="pen-toasts" role="alert" aria-live="assertive">${S.alerts.map(a=>`<div class="pen-toast ${a.kind}"><span class="pt-ico">!</span><span>${escapeHtml(a.msg)}</span></div>`).join('')}</div>`;
}
// ---- Atıktan alınan taşı geri bırakma ----
function mustReturnNow(){
  const r=S.room; return !!(r && isMyTurn() && r.turnPhase==='discard' && r.mustOpenSeat===S.mySeat && !(r.opened && r.opened[S.mySeat]));
}
function returnTakenToRoom(room, seat){
  const evs=room.takeEvents||[]; let k=-1;
  for(let i=evs.length-1;i>=0;i--) if(evs[i].takerSeat===seat){ k=i; break; }
  if(k<0) return null;
  const ev=evs[k], h=room.hands[seat], i=h.indexOf(ev.tileId);
  if(i<0) return null;
  evs.splice(k,1);
  h.splice(i,1);
  room.discards[ev.fromSeat].push(ev.tileId);
  room.mustOpenSeat=null; room.turnPhase='draw'; room.noRetakeSeat=seat;   // aynı taşı tekrar alamaz, yerden çeker
  return ev;
}
async function returnTakenTile(){
  if(!mustReturnNow()) return;
  const room=deepClone(S.room);
  const ev=returnTakenToRoom(room, S.mySeat); if(!ev) return;
  pushLog(room, `${myName()}, aldığı ${describeTile(room.allTilesById[ev.tileId])} taşını geri bıraktı.`);
  S.selectedTid=null;
  await persist(room);
}

// ---- Süre dolması: aldığı taşı geri bırak, gerekirse yerden çek, en küçük taşı at ----
function pickAutoDiscard(room, seat){
  const h=room.hands[seat], oc=room.okeyColor, on=room.okeyNumber, T=id=>room.allTilesById[id];
  const noOkey=h.filter(id=>!isOkey(T(id),oc,on));
  const safe=noOkey.filter(id=>!canExtendAnywhere(id,room));
  const pool=safe.length?safe:(noOkey.length?noOkey:h);
  return pool.reduce((b,id)=>tileValue(T(id),oc,on)<tileValue(T(b),oc,on)?id:b, pool[0]);
}
async function handleMyTimeout(){
  const r=S.room;
  if(S.timeoutBusy || !r || r.status!=='playing' || r.turnSeat!==S.mySeat || !r.turnDeadline || Date.now()<=r.turnDeadline) return;
  S.timeoutBusy=true;
  try{
    const room=deepClone(r), me=S.mySeat, notes=[];
    if(room.turnPhase==='discard' && room.mustOpenSeat===me && !(room.opened && room.opened[me])){
      const ev=returnTakenToRoom(room, me);
      if(ev) notes.push(`aldığın ${describeTile(room.allTilesById[ev.tileId])} geri bırakıldı`);
    }
    if(room.turnPhase==='draw'){
      if(room.deck.length===0){ scoreRound(room,null,null); await persist(room); return; }
      room.hands[me].push(room.deck.pop()); room.turnPhase='discard'; notes.push('yerden taş çekildi');
    }
    if(room.hands[me].length<=1 && room.opened && room.opened[me]){ S.timeoutBusy=false; S.room=room; await discardTile(room.hands[me][0]); return; }
    const tid=pickAutoDiscard(room, me);
    room.hands[me].splice(room.hands[me].indexOf(tid),1);
    room.discards[me].push(tid);
    notes.push(`en küçük taş (${describeTile(room.allTilesById[tid])}) atıldı`);
    pushLog(room, `${myName()}: süre doldu, ${notes.join(', ')}.`);
    pushAlert('Süren doldu: '+notes.join(', ')+'.', 'warn');
    room.noRetakeSeat=null; if(room.mustOpenSeat===me) room.mustOpenSeat=null;
    S.closeModalOpen=false; S.selectedTid=null;
    if(room.deck.length===0){ scoreRound(room,null,null); await persist(room); return; }
    room.turnSeat=nextSeat(me); room.turnPhase='draw';
    room.turnDeadline = room.turnSeconds ? Date.now()+room.turnSeconds*1000 : null;
    await persist(room);
  } finally { S.timeoutBusy=false; }
}

function notify(msg){ S.notice=msg; S.noticeUntil=Date.now()+6000; render(); }
function addPenalty(room, seat, amount, label){ room.penalties=room.penalties||[]; room.penalties.push({seat, amount, label}); }
function pushLog(room, msg){
  room.log = room.log || [];
  room.log.push(msg);
  if(room.log.length>60) room.log = room.log.slice(-60);
}
function isMyTurn(){ return S.room && S.room.status==='playing' && S.room.turnSeat===S.mySeat; }
function myName(){ const p=S.room.players.find(p=>p.seat===S.mySeat); return p?p.name:'?'; }
function seatName(room, seat){ const p=room.players.find(p=>p.seat===seat); return p?p.name:('Koltuk '+seat); }
function deepClone(o){ return JSON.parse(JSON.stringify(o)); }

/* ============================== CLOSING / SCORING ============================== */
const NOT_OPENED_PENALTY = 200;   // eli açamayan oyuncu, elindeki taşlardan bağımsız +200 yazar
function openOpenModal(){
  if(!isMyTurn() || S.room.turnPhase!=='discard') return;
  const myInfo = S.room.opened && S.room.opened[S.mySeat];
  S.modalKind = myInfo ? 'lay' : 'open';       // açmışsa: yeni per indir
  S.closeModalOpen=true;
  syncRack(S.room.hands[S.mySeat]);
  if(myInfo) S.closeMode=myInfo.mode;
  else {
    const mv=rackMelds(S.room).reduce((a,m)=>a+m.value,0), pc=rackPairs(S.room).length;
    S.closeMode = (pc>=OPEN_MIN_PAIRS && mv<OPEN_MIN) ? 'pairs' : 'groups';
  }
  prefillFromRack();
  render();
}
// ıstakada dizili perler / çiftler pencereye hazır gelir
function prefillFromRack(){
  syncRack(S.room.hands[S.mySeat]);
  const pre = S.closeMode==='pairs' ? rackPairs(S.room) : rackMelds(S.room);
  S.groups = pre.map(m=>m.ids.slice());
  const usedIds = new Set(S.groups.flat());
  S.ungrouped = S.room.hands[S.mySeat].filter(id=>!usedIds.has(id));
  S.pendingSelection=[];
  S.closeError='';
}
function setCloseMode(m){
  S.closeMode=m;
  prefillFromRack();
  render();
}
function openPreview(){
  const room=S.room; let total=0, bad=0;
  for(const g of S.groups){
    const tiles=g.map(id=>room.allTilesById[id]);
    if(S.closeMode==='pairs'){
      if(g.length===2 && validatePairs(tiles, room.okeyColor, room.okeyNumber).valid) total+=1; else bad++;
    } else {
      const r=validateGroup(tiles, room.okeyColor, room.okeyNumber);
      if(r.valid) total+=r.value; else bad++;
    }
  }
  return {total, bad};
}

  }
  const r2=deepClone(room);

  r2.hands[S.mySeat]=r2.hands[S.mySeat].filter(id=>!used.has(id));

// winnerSeat=null -> deste bitişi (kimse bitiremedi)
function scoreRound(room, winnerSeat, meldInfo){
  const okeyColor=room.okeyColor, okeyNumber=room.okeyNumber;
  const n = room.players.length;
  const breakdown = {};
  for(let s=0;s<n;s++) breakdown[s]=[];
  const addDelta = (seat, amount, label)=>{ breakdown[seat].push({label, amount}); };
  const hasWinner = winnerSeat!==null && winnerSeat!==undefined;

  if(hasWinner){
    addDelta(winnerSeat, -100, 'Eli bitirme bonusu');
    if(meldInfo.lastOkey) addDelta(winnerSeat, -100, 'Okey atarak bitirme bonusu');
    if(meldInfo.mode==='groups'){
      if(meldInfo.meldValue>60) addDelta(winnerSeat, -200, '60 üstü açılış bonusu (x2)');
      else if(meldInfo.meldValue>50) addDelta(winnerSeat, -100, '50 üstü açılış bonusu');
    }
    if(meldInfo.mode==='pairs'){
      if(meldInfo.pairCount>=9) addDelta(winnerSeat, -200, `${meldInfo.pairCount} çift açılış bonusu (x2)`);
      else if(meldInfo.pairCount>=7) addDelta(winnerSeat, -100, `${meldInfo.pairCount} çift açılış bonusu`);
    }
  }

  // atıktan alma: alan −sayı, atan +sayı (kazanan çift ile bittiyse kazananın kendi alışları x2)
  for(const ev of (room.takeEvents||[])){
    const t = room.allTilesById[ev.tileId];
    const faceVal = t.fake ? okeyNumber : t.number;
    let takerAmt = -faceVal, discAmt = faceVal;
    if(hasWinner && meldInfo.mode==='pairs' && ev.takerSeat===winnerSeat){ takerAmt*=2; discAmt*=2; }
    addDelta(ev.takerSeat, takerAmt, `Atıktan taş alma bonusu (${describeTile(t)})`);
    addDelta(ev.fromSeat, discAmt, `Atılan taş alındı cezası (${describeTile(t)})`);
  }

  // +101 ceza durumları ve perdesinden okey alınması
  for(const p of (room.penalties||[])) addDelta(p.seat, p.amount, p.label);

  // elde kalan taşlar: açamayan direkt +200, açmış olan elindeki taşların toplamı
  for(let s=0;s<n;s++){
    if(hasWinner && s===winnerSeat) continue;
    if(!(room.opened && room.opened[s])){ addDelta(s, NOT_OPENED_PENALTY, 'Açamadı cezası'); continue; }
    const sum = room.hands[s].map(id=>room.allTilesById[id]).reduce((acc,t)=>acc+tileValue(t, okeyColor, okeyNumber), 0);
    if(sum>0) addDelta(s, sum, 'Elde kalan taş puanı');
  }

  const deltaTotals = {};
  for(let s=0;s<n;s++){
    const total = breakdown[s].reduce((a,b)=>a+b.amount,0);
    deltaTotals[s]=total;
    room.scores[s] = (room.scores[s]||0) + total;
  }
  room.roundResult = {
    winnerSeat: hasWinner?winnerSeat:null, deckEnd:!hasWinner, breakdown, deltaTotals,
    meldMode: meldInfo?meldInfo.mode:null,
    meldValue:(meldInfo&&meldInfo.meldValue)||0, pairCount:(meldInfo&&meldInfo.pairCount)||null,
  };
  room.status='roundEnd';
  room.mustOpenSeat=null;
  pushLog(room, hasWinner ? `${seatName(room,winnerSeat)} eli bitirdi.` : 'Deste bitti, el kimse bitiremeden sona erdi.');
}

// işleme / okey değişimi: seçili taşı masadaki bir pere işle
async function meldClick(seat, gi, tidArg){
  if(!canDiscardNow()) return;
  const me=S.mySeat, r0=S.room;
  const mi=r0.opened && r0.opened[me];
  if(!mi){ notify('İşlemek için önce perlerini açmalısın.'); return; }
  if(mi.mode!=='groups'){ notify('Çift ile açanlar perlere taş işleyemez.'); return; }
  const oi=r0.opened[seat];
  if(!oi || oi.mode!=='groups'){ notify('Çiftlere taş işlenemez.'); return; }
  const tid=tidArg||S.selectedTid;
  if(!tid || !r0.hands[me].includes(tid)){ notify('Önce ıstakandan işlenecek taşı seç, sonra pere tıkla ya da taşı pere sürükle.'); return; }
  if(r0.hands[me].length<2){ notify('Atmak için elinde en az 1 taş kalmalı.'); return; }
  const room=deepClone(r0);
  const meld=room.table[seat][gi];
  const swapId=findSwapOkey(tid, meld, room);
  const hand=room.hands[me];
  if(swapId){
    const k=meld.indexOf(swapId);
    meld[k]=tid;
    hand.splice(hand.indexOf(tid),1);
    hand.push(swapId);
    const a=arrangeMeld(meld, room); if(a) room.table[seat][gi]=a.ids;
    pushLog(room, `${myName()}, ${seatName(room,seat)} oyuncusunun perindeki okeyi ${describeTile(room.allTilesById[tid])} ile değiştirip aldı.`);
    if(seat!==me){ addPenalty(room, seat, 101, 'Perinden okey alındı'); pushLog(room, `${seatName(room,seat)}: perinden okey alındı, +101 ceza.`); }
  } else if(canExtendMeld(tid, meld, room)){
    hand.splice(hand.indexOf(tid),1);
    const a=arrangeMeld(meld.concat([tid]), room);
    room.table[seat][gi]=a.ids;
    pushLog(room, `${myName()}, ${seatName(room,seat)} oyuncusunun perine ${describeTile(room.allTilesById[tid])} taşını işledi.`);
  } else { notify('Bu taş o pere işlenemez.'); return; }
  S.selectedTid=null; S.selectedIdx=null;
  await persist(room);
}

/* ============================== SORT / SELECT HAND ============================== */
function sortSingles(ids, room){
  const oc=room.okeyColor, on=room.okeyNumber;
  const k=id=>{ const t=normTile(room.allTilesById[id],oc,on); return isOkey(t,oc,on)?999:COLORS.indexOf(t.color)*13+t.number; };
  return ids.slice().sort((a,b)=>k(a)-k(b));
}
// grupları ıstakaya yerleştir: grup satır taşmaz, gruplar arası 1 boşluk (sığmazsa boşluksuz), kalanlar sona
function layoutRack(groups, rest){
  const cols=rackCols();
  const tryLayout=(gap)=>{
    const slots=Array(RACK_SLOTS).fill(null); let pos=0;
    for(const g of groups){
      if(pos%cols && pos%cols+g.length>cols) pos=Math.ceil(pos/cols)*cols;
      if(pos+g.length>RACK_SLOTS) return null;
      g.forEach(id=>{ slots[pos++]=id; });
      if(gap && pos%cols) pos++;
    }
    if(!gap && rest.length && pos%cols) pos++;
    for(const id of rest){ if(pos>=RACK_SLOTS) return null; slots[pos++]=id; }
    return slots;
  };
  S.rackSlots = tryLayout(true) || tryLayout(false) || (()=>{ const s=Array(RACK_SLOTS).fill(null); groups.flat().concat(rest).forEach((id,i)=>{ s[i]=id; }); return s; })();
  S.selectedTid=null;
}
// Seri Diz: ulaşılabilecek en yüksek puanlı perleri kurar
function sortMyHand(){
  const room=S.room, plan=bestMeldPlan(room.hands[S.mySeat], room);
  const groups=plan.groups.map(g=>{ const a=arrangeMeld(g,room); return a?a.ids:g; }).sort((a,b)=>b.length-a.length);
  layoutRack(groups, sortSingles(plan.leftover, room));
  notify(plan.groups.length ? `Seri diz: ${plan.groups.length} per, toplam ${plan.value} puan${plan.value>=OPEN_MIN?' (açabilirsin)':''}.` : 'Elinde per oluşmuyor.');
}
// Çift Diz: çiftleri (okeyle tamamlananlar dahil) yan yana dizer
function sortPairsHand(){
  const room=S.room, plan=bestPairPlan(room.hands[S.mySeat], room);
  layoutRack(plan.pairs, sortSingles(plan.leftover, room));
  notify(`Çift diz: ${plan.pairs.length} çift${plan.pairs.length>=OPEN_MIN_PAIRS?' (açabilirsin)':''}.`);
}

/* ============================== RACK (ıstaka) + DRAG & DROP ============================== */
const RACK_SLOTS = 30;
function rackCols(){ return window.innerWidth < 760 ? 10 : 15; }   // masaüstü 2x15, telefon 3x10

function syncRack(hand){
  if(!Array.isArray(S.rackSlots) || S.rackSlots.length!==RACK_SLOTS) S.rackSlots = Array(RACK_SLOTS).fill(null);
  const inHand = new Set(hand);
  S.rackSlots = S.rackSlots.map(id => (id && inHand.has(id)) ? id : null);
  const placed = new Set(S.rackSlots.filter(Boolean));
  const missing = hand.filter(id=>!placed.has(id));
  if(missing.length===0) return;
  if(placed.size===0){
    // yeni dağıtım: taşları satırlara eşit yay
    const cols=rackCols(), rows=Math.ceil(missing.length/cols), perRow=Math.ceil(missing.length/rows);
    missing.forEach((id,i)=>{ S.rackSlots[Math.floor(i/perRow)*cols + (i%perRow)] = id; });
  } else {
    for(const id of missing){ const i=S.rackSlots.indexOf(null); if(i===-1) break; S.rackSlots[i]=id; }
  }
}
function moveRackTile(tid, toIdx){
  const from = S.rackSlots.indexOf(tid);
  if(from===-1 || from===toIdx) return;
  const other = S.rackSlots[toIdx];          // boşsa taşınır, doluysa yer değiştirir
  S.rackSlots[toIdx]=tid; S.rackSlots[from]=other;
}
// Istakada yan yana duran ve kurala uygun (seri/set) taşları otomatik per olarak tanır.
function rackMelds(room){
  const cols=rackCols(), rows=RACK_SLOTS/cols, oc=room.okeyColor, on=room.okeyNumber, out=[];
  for(let r=0;r<rows;r++){
    let c=0;
    while(c<cols){
      if(!S.rackSlots[r*cols+c]){ c++; continue; }
      let e=c; while(e<cols && S.rackSlots[r*cols+e]) e++;
      const idxs=[]; for(let k=c;k<e;k++) idxs.push(r*cols+k);
      const ids=idxs.map(i=>S.rackSlots[i]), n=ids.length;
      const best=[{cov:0,val:0,prev:-1,grp:false}];
      for(let i=1;i<=n;i++){
        let b={cov:best[i-1].cov,val:best[i-1].val,prev:i-1,grp:false};
        for(let L=3;L<=Math.min(13,i);L++){
          const res=validateGroup(ids.slice(i-L,i).map(id=>room.allTilesById[id]),oc,on);
          if(!res.valid) continue;
          const cand={cov:best[i-L].cov+L,val:best[i-L].val+res.value,prev:i-L,grp:true,gval:res.value};
          if(cand.cov>b.cov || (cand.cov===b.cov && cand.val>b.val)) b=cand;
        }
        best.push(b);
      }
      let i=n;
      while(i>0){ const b=best[i]; if(b.grp) out.push({slots:idxs.slice(b.prev,i), ids:ids.slice(b.prev,i), value:b.gval}); i=b.prev; }
      c=e;
    }
  }
  return out;
}

// Per içindeki bir taş sürüklenirse perin tamamı taşınır. Seçili (kaldırılmış) taş tek başına taşınır.
function meldOfTile(tid){
  if(!S.room || S.selectedTid===tid) return null;
  const m=rackMelds(S.room).find(m=>m.ids.includes(tid)) || rackPairs(S.room).find(m=>m.ids.includes(tid));
  return m && m.ids.length>1 ? m : null;
}
function groupTargetStart(grp, idx){
  const cols=rackCols(), rs=Math.floor(idx/cols)*cols;
  return Math.max(rs, Math.min(idx-grp.k, rs+cols-grp.ids.length));
}
function moveRackGroup(ids, st){
  const slots=S.rackSlots;
  const from=ids.map(id=>slots.indexOf(id));
  if(from.some(i=>i<0)) return;
  from.forEach(i=>{ slots[i]=null; });
  const targets=ids.map((_,k)=>st+k);
  const displaced=targets.map(i=>slots[i]).filter(Boolean);
  targets.forEach((i,k)=>{ slots[i]=ids[k]; });
  const free=from.filter(i=>!slots[i]);
  displaced.forEach(id=>{ let i=free.length?free.shift():slots.indexOf(null); if(i>=0) slots[i]=id; });
}
// Istakada yan yana duran çiftleri tanır (2'li gruplar; aralıksız dizilmiş çift blokları da bölünür)
function rackPairs(room){
  const cols=rackCols(), rows=RACK_SLOTS/cols, oc=room.okeyColor, on=room.okeyNumber, out=[];
  for(let r=0;r<rows;r++){
    let c=0;
    while(c<cols){
      if(!S.rackSlots[r*cols+c]){ c++; continue; }
      let e=c; while(e<cols && S.rackSlots[r*cols+e]) e++;
      const idxs=[]; for(let k=c;k<e;k++) idxs.push(r*cols+k);
      if(idxs.length%2===0){
        const ps=[];
        for(let k=0;k<idxs.length;k+=2){
          const ids=[S.rackSlots[idxs[k]], S.rackSlots[idxs[k+1]]];
          if(!validatePairs(ids.map(id=>room.allTilesById[id]),oc,on).valid){ ps.length=0; break; }
          ps.push({slots:[idxs[k],idxs[k+1]], ids});
        }
        ps.forEach(p=>out.push(p));
      }
      c=e;
    }
  }
  return out;
}
function canDiscardNow(){ return !!(S.room && S.room.status==='playing' && isMyTurn() && S.room.turnPhase==='discard'); }

function clearOver(){ document.querySelectorAll('.slot.over,.mid.over,.meld.over').forEach(x=>x.classList.remove('over')); }
// Taş masadaki bir pere işlenebiliyorsa, bırakılan noktaya en yakın uygun peri döndür
function nearestWorkTarget(tid, x, y){
  const r=S.room, me=S.mySeat, mi=r && r.opened && r.opened[me];
  if(!mi || mi.mode!=='groups' || !r.hands[me].includes(tid) || r.hands[me].length<2) return null;
  let best=null, bd=Infinity;
  document.querySelectorAll('.meld[data-seat]').forEach(el=>{
    const seat=parseInt(el.dataset.seat,10), gi=parseInt(el.dataset.gi,10);
    const oi=r.opened[seat]; if(!oi || oi.mode!=='groups') return;
    const meld=r.table[seat] && r.table[seat][gi]; if(!meld) return;
    if(!findSwapOkey(tid, meld, r) && !canExtendMeld(tid, meld, r)) return;
    const b=el.getBoundingClientRect();
    const dx=Math.max(b.left-x,0,x-b.right), dy=Math.max(b.top-y,0,y-b.bottom), dist=Math.hypot(dx,dy);
    if(dist<bd){ bd=dist; best={seat, gi, el}; }
  });
  return best;
}
function dragListenersOff(){
  window.removeEventListener('pointermove', dragMove);
  window.removeEventListener('pointerup', dragEnd);
  window.removeEventListener('pointercancel', dragCancel);
  window.removeEventListener('blur', dragCancel);
}
function rackPointerDown(e, tid){
  if(e.pointerType==='mouse' && e.button!==0) return;
  e.preventDefault();
  const el=e.currentTarget, r=el.getBoundingClientRect();
  const m=meldOfTile(tid);
  let grp=null, fr=r;
  if(m){
    grp={ids:m.ids.slice(), k:m.ids.indexOf(tid)};
    const first=document.querySelector(`.slot[data-idx="${m.slots[0]}"] .tile`);
    if(first) fr=first.getBoundingClientRect();
  }
  S.drag={tid, el, grp, x0:e.clientX, y0:e.clientY, offX:e.clientX-fr.left, offY:e.clientY-fr.top, w:r.width, h:r.height, active:false, ghost:null};
  window.addEventListener('pointermove', dragMove);
  window.addEventListener('pointerup', dragEnd);
  window.addEventListener('pointercancel', dragCancel);
  window.addEventListener('blur', dragCancel);
}
function dragMove(e){
  const d=S.drag; if(!d) return;
  if(!d.active){
    if(Math.hypot(e.clientX-d.x0, e.clientY-d.y0) < 6) return;
    d.active=true;
    if(d.grp){
      const g=document.createElement('div'); g.className='drag-ghost group-ghost';
      d.grp.ids.forEach(id=>{
        const src=document.querySelector(`.slot[data-idx="${S.rackSlots.indexOf(id)}"] .tile`); if(!src) return;
        const c=src.cloneNode(true); c.classList.remove('selected'); c.removeAttribute('onpointerdown');
        c.style.width=d.w+'px'; c.style.height=d.h+'px';
        g.appendChild(c); src.style.opacity='.25';
      });
      document.body.appendChild(g); d.ghost=g;
    } else {
      const g=d.el.cloneNode(true);
      g.classList.remove('selected'); g.classList.add('drag-ghost');
      g.removeAttribute('onpointerdown');
      g.style.width=d.w+'px'; g.style.height=d.h+'px';
      document.body.appendChild(g); d.ghost=g;
      d.el.style.opacity='.25';
    }
  }
  d.ghost.style.left=(e.clientX-d.offX)+'px';
  d.ghost.style.top=(e.clientY-d.offY)+'px';
  clearOver();
  const t=document.elementFromPoint(e.clientX,e.clientY);
  const slot=t && t.closest ? t.closest('.slot') : null;
  if(slot && d.grp){
    const st=groupTargetStart(d.grp, parseInt(slot.dataset.idx,10));
    d.grp.ids.forEach((_,k)=>{ const s=document.querySelector(`.slot[data-idx="${st+k}"]`); if(s) s.classList.add('over'); });
    return;
  }
  if(slot){ slot.classList.add('over'); return; }
  if(d.grp) return;
  const meldEl=t && t.closest ? t.closest('.meld[data-seat]') : null;
  if(meldEl && canDiscardNow()){ meldEl.classList.add('over'); return; }
  const mid=t && t.closest ? t.closest('.mid') : null;
  if(mid && canDiscardNow()){
    const inRuns=t.closest('.mz-runs');   // yalnızca per alanına bırakılırsa işle; başka yer = at
    const tgt=inRuns?nearestWorkTarget(d.tid, e.clientX, e.clientY):null;
    if(tgt) tgt.el.classList.add('over'); else mid.classList.add('over');
  }
}
async function dragEnd(e){
  const d=S.drag; dragListenersOff(); if(!d) return;
  const target = d.active ? document.elementFromPoint(e.clientX,e.clientY) : null;
  if(d.ghost) d.ghost.remove();
  clearOver();
  S.drag=null;
  if(!d.active){
    // sürükleme yok: tıklama. Aynı taşa hızlı çift tık = at
    const now=Date.now();
    if(S.lastClick && S.lastClick.tid===d.tid && now-S.lastClick.t<350 && canDiscardNow()){
      S.lastClick=null; S.selectedTid=null; await discardTile(d.tid); return;
    }
    S.lastClick={tid:d.tid, t:now};
    S.selectedTid = (S.selectedTid===d.tid) ? null : d.tid;
    render(); return;
  }
  const slot=target && target.closest ? target.closest('.slot') : null;
  if(slot && d.grp){ moveRackGroup(d.grp.ids, groupTargetStart(d.grp, parseInt(slot.dataset.idx,10))); render(); return; }
  if(slot){ moveRackTile(d.tid, parseInt(slot.dataset.idx,10)); render(); return; }
  if(d.grp){ render(); return; }   // per ortaya atılamaz; yerine döner
  const meldEl=target && target.closest ? target.closest('.meld[data-seat]') : null;
  if(meldEl && canDiscardNow()){ await meldClick(parseInt(meldEl.dataset.seat,10), parseInt(meldEl.dataset.gi,10), d.tid); return; }
  const mid=target && target.closest ? target.closest('.mid') : null;
  if(mid && canDiscardNow()){
    const inRuns=target.closest('.mz-runs');
    const tgt=inRuns?nearestWorkTarget(d.tid, e.clientX, e.clientY):null;
    if(tgt){ await meldClick(tgt.seat, tgt.gi, d.tid); return; }
    S.selectedTid=null; await discardTile(d.tid); return;
  }
  render();   // başka yere bırakıldı: taş yerine döner
}
function dragCancel(){
  const d=S.drag; dragListenersOff(); if(!d) return;
  if(d.ghost) d.ghost.remove();
  clearOver(); S.drag=null; render();
}

function tileHTML(tile, opts){
  opts = opts||{};
  const cls = ['tile']; if(opts.small) cls.push('small'); if(opts.mini) cls.push('mini'); if(opts.selected) cls.push('selected'); if(tile.fake) cls.push('fake'); if(opts.cls) cls.push(opts.cls);
  const clickAttr = (opts.onclick ? `onclick="${opts.onclick}"` : '') + (opts.attrs ? ' '+opts.attrs : '');
  if(tile.fake){
    return `<div class="${cls.join(' ')}" ${clickAttr} title="Sahte Okey">
      <svg viewBox="0 0 24 24" aria-hidden="true" style="width:62%;height:auto;margin-top:6%"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z" fill="#1F1F1F"/></svg>
    </div>`;
  }
  return `<div class="${cls.join(' ')}" ${clickAttr}>
    <div class="num c-${tile.color}">${tile.number}</div>
    <div class="dot bg-${tile.color}"></div>
  </div>`;
}
function tileBackHTML(){ return `<div class="back-tile"></div>`; }

}

function meldsAreaHTML(room, seats){
  const myInfo = room.opened && room.opened[S.mySeat];
  const canWork = canDiscardNow() && myInfo && myInfo.mode==='groups';
  const runs=[], pairs=[];
  seats.forEach(seat=>{
    const info=room.opened && room.opened[seat];
    const groups=(room.table && room.table[seat]) || [];
    groups.forEach((g,gi)=>{
      const isPair = info && info.mode==='pairs';
      const work = !isPair && canWork;
      const html = `<div class="meld ${work?'workable':''} ${seat===S.mySeat?'mine':''}" ${isPair?'':`data-seat="${seat}" data-gi="${gi}"`} ${work?`onclick="meldClick(${seat},${gi})" title="Seçili taşı bu pere işle"`:''}>${g.map(tid=>tileHTML(room.allTilesById[tid],{mini:true})).join('')}</div>`;
      (isPair?pairs:runs).push(html);
    });
  });
  return `<div class="melds-area">
    <div class="mz mz-runs">${runs.join('') || '<span class="mz-empty">Seri perler</span>'}</div>
    <div class="mz mz-pairs">${pairs.join('') || '<span class="mz-empty">Çiftler</span>'}</div>

  const myHand = room.hands[me].map(id=>({id, t:room.allTilesById[id]}));
  const indicator = room.allTilesById[room.indicatorTileId];
  const okeyTile = {color:room.okeyColor, number:room.okeyNumber, fake:false};
  const myTurn = isMyTurn();
  const iOpened = !!(room.opened && room.opened[me]);
  const timeLeftPct = room.turnDeadline ? Math.max(0, Math.min(100, ((room.turnDeadline-Date.now())/(room.turnSeconds*1000))*100)) : 100;

  const rackPairList = rackPairs(room);
